name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
            packagedExecutable: release/win-unpacked/AI Corporation Desktop.exe
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
            packagedExecutable: release/mac-arm64/AI Corporation Desktop.app/Contents/MacOS/AI Corporation Desktop

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run engineering checks
        run: pnpm check

      - name: Run Electron health E2E
        run: pnpm test:e2e

      - name: Build unsigned installer
        run: pnpm --filter @ai-corporation/desktop package

      - name: Run packaged application health E2E
        run: pnpm --filter @ai-corporation/desktop test:packaged -- "${{ matrix.packagedExecutable }}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ai-corporation-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/*.png
          if-no-files-found: error
          retention-days: 14
