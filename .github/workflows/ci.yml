name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: CI scope
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.scope.outputs.full_ci }}
      closure_only: ${{ steps.scope.outputs.closure_only }}
    steps:
      - name: Check out repository head
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Classify completion commit
        id: scope
        env:
          AI_CORPORATION_ALLOW_CLOSURE_REUSE: ${{ github.event_name == 'pull_request' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-closure-scope.mjs

      - name: Check closure evidence documents
        if: steps.scope.outputs.closure_only == 'true'
        run: |
          node scripts/check-project-status.mjs
          node scripts/check-task-units.mjs
          node scripts/secret-scan.mjs
          git diff --check HEAD^ HEAD

  build:
    name: ${{ matrix.name }}
    needs: classify
    if: needs.classify.outputs.full_ci == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
            packagedExecutable: release/win-unpacked/AI Corporation Desktop.exe
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
            packagedExecutable: release/mac-arm64/AI Corporation Desktop.app/Contents/MacOS/AI Corporation Desktop

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Electron binary
        timeout-minutes: 10
        run: pnpm --filter @ai-corporation/desktop exec install-electron --no

      # 与根目录 pnpm check 保持同一顺序，但拆开显示，失败时能直接看出
      # 是项目记录、前端测试、Rust 测试还是安全扫描出了问题。
      - name: Check project records and code style
        run: |
          pnpm check:status
          pnpm check:task-units
          pnpm format:check
          pnpm lint
          pnpm typecheck

      - name: Run JavaScript and TypeScript tests
        run: pnpm test

      - name: Run Rust tests
        run: pnpm test:rust

      - name: Check Rust code style
        run: pnpm rust:fmt

      - name: Run Rust lints
        run: pnpm rust:clippy

      - name: Scan for committed secrets
        run: pnpm secret:scan

      - name: Run Electron health E2E
        run: pnpm test:e2e

      - name: Upload Electron E2E failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-failure-${{ matrix.artifact }}
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Build unsigned installer
        run: pnpm --filter @ai-corporation/desktop package

      - name: Run packaged application health E2E
        run: pnpm --filter @ai-corporation/desktop test:packaged -- "${{ matrix.packagedExecutable }}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ai-corporation-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/*.png
          if-no-files-found: error
          retention-days: 14
